name: ci

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate
      - name: Typecheck API
        run: npm run build --workspace=apps/api
      # The test global setup derives the SQLite schema and client itself, so no
      # database service or prepare step is needed.
      - name: Tests
        working-directory: apps/api
        env:
          DATABASE_URL: file:./test.db
          NODE_ENV: test
        run: npm test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Build web
        run: npm run build --workspace=apps/web
